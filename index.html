<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>Jeux</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icones/icone.svg" type="image/svg+xml">
<style>
/* L'écran de choix du jeu. Il doit rester lisible sur la liseuse e-ink de
   Mot à Mot comme sur la tablette des flashcards : noir sur blanc, aplats,
   aucune animation. */
html, body {
  margin: 0;
  height: 100%;
  background: #fff;
  color: #000;
  font: 16px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  -webkit-tap-highlight-color: transparent;
}
body {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 4vmin;
  padding: 16px;
  box-sizing: border-box;
}
h1 { margin: 0; font-size: 22px; font-weight: 600; }
.jeux {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 4vmin;
  width: min(100%, 980px);
}
.jeu {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 2vmin;
  aspect-ratio: 1;
  border: 3px solid #000;
  border-radius: 24px;
  color: #000;
  background: #fff;
  text-decoration: none;
}
.jeu:active { background: #000; color: #fff; }
.jeu .dessin {
  font-size: min(18vmin, 150px);
  line-height: 1;
  font-family: "Noto Color Emoji", "Apple Color Emoji", "Segoe UI Emoji", sans-serif;
}
.jeu .lettres { font-family: inherit; font-weight: 700; letter-spacing: .04em; }
.jeu .nom { font-size: min(5vmin, 32px); font-weight: 700; }
.jeu .quoi { font-size: min(3vmin, 18px); }
@media (orientation: portrait) {
  .jeux { grid-template-columns: 1fr; width: min(100%, 60vh); }
  .jeu { aspect-ratio: 4 / 3; }
}
</style>
</head>
<body>
<h1>Choisir un jeu</h1>
<nav class="jeux">
  <a class="jeu" id="jeu-mot-a-mot" href="mot-a-mot/index.html">
    <span class="dessin" aria-hidden="true">🐕</span>
    <span class="nom">Mot à Mot</span>
    <span class="quoi">une image au centre, quatre voisines</span>
  </a>
  <a class="jeu" id="jeu-flashcards" href="flashcards/index.html">
    <span class="dessin lettres" aria-hidden="true">A b 2</span>
    <span class="nom">Flashcards</span>
    <span class="quoi">mots, lettres, chiffres</span>
  </a>
</nav>
<script>
  // Installé sur l'écran d'accueil, l'ensemble fonctionne hors ligne.
  if ("serviceWorker" in navigator && /^https?:$/.test(location.protocol))
    navigator.serviceWorker.register("sw.js").catch(function () {});
</script>
</body>
</html>
